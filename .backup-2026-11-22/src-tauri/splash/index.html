<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STRATA</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; background: #080b10; color: #e8edf4;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background-image: radial-gradient(rgba(148,163,184,0.06) 1px, transparent 1px); background-size: 22px 22px;
      }
      .box { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; max-width: 460px; padding: 24px; }
      .mark { width: 72px; height: 72px; animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.55; transform: scale(0.96); } }
      h1 { margin: 0; font-size: 20px; letter-spacing: 0.32em; font-weight: 700; }
      p { margin: 0; color: #8d99ab; font-size: 13px; line-height: 1.6; }
      .bar { width: 240px; height: 3px; border-radius: 3px; background: rgba(148,163,184,0.15); overflow: hidden; }
      .bar i { display: block; width: 40%; height: 100%; background: #f5a524; border-radius: 3px; animation: slide 1.3s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      .err { display: none; color: #fb7185; background: rgba(251,113,133,0.1); border: 1px solid rgba(251,113,133,0.3); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="box">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="#121922" stroke="rgba(148,163,184,0.22)" />
        <path d="M7 21.5 16 26l9-4.5" fill="none" stroke="#f5a524" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
        <path d="M7 16.5 16 21l9-4.5" fill="none" stroke="#f5a524" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
        <path d="M16 6.5 25 11 16 15.5 7 11Z" fill="#f5a524" />
      </svg>
      <h1>STRATA</h1>
      <div class="bar" id="bar"><i></i></div>
      <p id="msg">Starting the mine engine…</p>
      <p id="hint" style="font-size:12px;color:#5a6577">Catching up on the mine since STRATA was last open.</p>
      <div class="err" id="err"></div>
    </div>
    <script>
      window.strataError = function (text) {
        document.getElementById('bar').style.display = 'none';
        document.getElementById('hint').style.display = 'none';
        document.getElementById('msg').textContent = 'STRATA could not start';
        var e = document.getElementById('err');
        e.textContent = text;
        e.style.display = 'block';
      };
    </script>
  </body>
</html>
